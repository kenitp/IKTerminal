name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: ver
        run: |
          set -eu
          version=$(./scripts/version.sh)
          if [ -z "$version" ]; then
            echo "version not found in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git show "${before}:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)
          if [ "$version" = "$prev" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/package.yml
    with:
      package: true

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: IkTerminal ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  apt:
    needs: [prepare, publish]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: awalsh128/cache-apt-pkgs-action@v1.5.3
        with:
          packages: dpkg-dev gnupg
          version: apt-publish-1

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "GitHub secret APT_GPG_PRIVATE_KEY is not set." >&2
            echo "Run scripts/generate-apt-key.sh and:" >&2
            echo "  gh secret set APT_GPG_PRIVATE_KEY < packaging/linux/apt/ikterminal-private.asc" >&2
            exit 1
          fi
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build apt repository
        run: |
          set -eu
          mkdir -p apt-site
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git archive gh-pages | tar -x -C apt-site
          fi
          rm -rf apt-site/dists apt-site/index.html
          # Keep previous pool; add/replace debs from this release.
          deb=$(find dist -name '*.deb' -type f | head -n 1)
          if [ -z "$deb" ]; then
            echo "no .deb artifact found" >&2
            exit 1
          fi
          sh scripts/apt-repo.sh apt-site "$deb"

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-site
          force_orphan: false
