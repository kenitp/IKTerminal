name: Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev libwayland-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Package Linux
        if: runner.os == 'Linux'
        run: sh scripts/package-linux.sh

      - name: Package Windows
        if: runner.os == 'Windows'
        run: .\scripts\build-installer.ps1

      - name: Upload Linux archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: target/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: target/installer/*.exe
          if-no-files-found: error
